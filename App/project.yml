# Generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#
#   brew install xcodegen
#   cd App && xcodegen
#   open RaumfeldRemote.xcodeproj
#
name: RaumfeldRemote
options:
  bundleIdPrefix: com.example.raumfeld   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RaumfeldKit:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                 # set your team ID here or in Xcode

targets:
  RaumfeldRemote:
    type: application
    platform: iOS
    sources:
      - path: RaumfeldRemote
    dependencies:
      - package: RaumfeldKit
        product: RaumfeldKit
    info:
      path: RaumfeldRemote/Info.plist
      properties:
        CFBundleDisplayName: Raumfeld Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Raumfeld Remote controls the Raumfeld speakers on your home network.
        # The Raumfeld host and speakers only speak plain HTTP on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.raumfeld.remote
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # To enable automatic host discovery (SSDP multicast), request the
    # com.apple.developer.networking.multicast entitlement from Apple, then
    # uncomment this block:
    # entitlements:
    #   path: RaumfeldRemote/RaumfeldRemote.entitlements
    #   properties:
    #     com.apple.developer.networking.multicast: true
